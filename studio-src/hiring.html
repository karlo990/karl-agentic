<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Unbounded:wght@400;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Karl Agentic hiring carousel: 8 slides, 1080×1350, white editorial style with brand pink. */
:root{--pink:#F0287A;--pink2:#C8155E;--ink:#0B1530;--muted:#5B6275;--line:#ECE6EA;--tint:#FFF1F6}
html,body{margin:0;background:#ddd}
.s{width:1080px;height:1350px;box-sizing:border-box;position:relative;overflow:hidden;background:#fff;color:var(--ink);font-family:"Inter Tight",sans-serif;padding:72px 84px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.top .lab{font-size:34px;font-weight:500;letter-spacing:-.01em;text-decoration:underline;text-underline-offset:8px;text-decoration-thickness:2px}
.top img{width:74px;height:74px;border-radius:18px}
.foot{position:absolute;left:84px;right:84px;bottom:56px;display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:20px;color:var(--muted);letter-spacing:.06em}
.foot b{color:var(--pink)}
/* cover */
.arrow{margin-top:56px;width:150px;height:150px}
.big{font-weight:800;color:var(--pink);font-size:250px;line-height:.84;letter-spacing:-.06em;margin:24px 0 0 -8px}
.chip{display:inline-block;background:var(--pink);color:#fff;font-size:44px;font-weight:600;letter-spacing:-.02em;padding:14px 26px;margin-top:44px;align-self:flex-start}
.cov-sub{margin-top:46px;font-size:34px;line-height:1.35;color:var(--muted);max-width:820px;font-weight:500}
.cov-list{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.cov-list span{border:2px solid var(--line);border-radius:99px;padding:10px 20px;font-size:24px;font-weight:600}
/* role */
.num{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:24px;color:var(--pink);letter-spacing:.1em;margin-top:36px}
.illo{height:400px;margin:14px -20px 0;display:flex;align-items:center;justify-content:center}
.illo img{max-height:400px;max-width:100%;object-fit:contain}
.role{font-weight:800;font-size:74px;line-height:.98;letter-spacing:-.045em;margin-top:8px}
.role em{font-style:normal;color:var(--pink)}
.tags{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.tags span{background:var(--tint);color:var(--pink2);font-weight:700;font-size:21px;padding:8px 16px;border-radius:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:28px}
.cols h4{margin:0 0 12px;font-size:22px;font-family:"JetBrains Mono",monospace;letter-spacing:.12em;color:var(--muted);font-weight:700}
.cols ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.cols li{font-size:25px;line-height:1.3;font-weight:500;padding-left:26px;position:relative}
.cols li::before{content:"";position:absolute;left:0;top:12px;width:12px;height:12px;background:var(--pink)}
/* proof */
.proof h2{font-weight:800;font-size:84px;line-height:.95;letter-spacing:-.045em;margin:40px 0 0}
.proof h2 em{font-style:normal;color:var(--pink)}
.proof .illo{height:380px;margin-top:10px}
.proof .illo img{max-height:380px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.grid div{border:2px solid var(--line);padding:18px 20px;border-radius:12px}
.grid b{display:block;font-size:27px;letter-spacing:-.02em}
.grid span{display:block;font-size:21px;color:var(--muted);margin-top:4px;line-height:1.3}
.apply{margin-top:22px;background:var(--ink);color:#fff;border-radius:14px;padding:24px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.apply b{font-size:30px;letter-spacing:-.02em}
.apply span{display:block;font-size:22px;color:#C9D0E0;margin-top:6px}
.apply .mail{background:var(--pink);padding:14px 20px;border-radius:8px;font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700;white-space:nowrap}
</style></head><body><div id="root"></div>
<script>
const LOGO='../assets/logo/pink-tile.png';
const MAIL='karlagenticzw@gmail.com';
const ROLES=[
 {k:'server',t:'Server &amp; <em>Infrastructure</em> Technician',tags:['Full-time','On-site installs','Hardware'],
  do:['Install and cable server racks and GPU machines','Set up Ubuntu, Docker and NVIDIA drivers','Configure networks, backups and UPS','Support clients on-site and remotely'],
  need:['Linux and networking basics','Hands-on hardware experience','Neat, careful and reliable','Driver’s licence is a plus']},
 {k:'llm',t:'AI / <em>LLM</em> Engineer',tags:['Full-time','Remote-friendly','Python'],
  do:['Build AI agents for WhatsApp and web','Connect LLMs to calendars, CRMs and payments','Run private models with Ollama','Test, monitor and improve agents'],
  need:['Python or JavaScript','APIs, webhooks and JSON','Prompting and RAG experience','A project you can show us']},
 {k:'design',t:'Graphic <em>Designer</em>',tags:['Full-time','Junior–mid','Creative'],
  do:['Design carousels, flyers and brand kits','Keep every post on-brand','Build reusable templates','Work with our content automation'],
  need:['Canva, Figma or Adobe','A portfolio (Instagram is fine)','Strong typography and layout','Takes feedback well']},
 {k:'electronics',t:'Electronics &amp; <em>Hardware</em> Technician',tags:['Full-time','Workshop','Hands-on'],
  do:['Build and test AI workstations','Repair and upgrade PCs and laptops','Install CCTV and edge AI devices','Keep stock and parts organised'],
  need:['Electronics or IT qualification','Soldering and diagnostics','PC building experience','Careful with expensive parts']},
 {k:'video',t:'3D &amp; <em>Video</em> Creator',tags:['Contract','Portfolio','Creative'],
  do:['Product renders in Blender','Edit Reels, ads and client videos','Animate logos and motion graphics','Use AI tools in the workflow'],
  need:['Blender and/or Premiere / CapCut','A showreel','Eye for lighting and pacing','Delivers on time']},
 {k:'social',t:'Social Media &amp; <em>Automation</em> Specialist',tags:['Full-time','Growth','Marketing'],
  do:['Run our and our clients’ content calendars','Set up comment-to-DM and lead funnels','Report what works every week','Reply to leads fast'],
  need:['Instagram, TikTok and LinkedIn know-how','Zapier, Make or n8n is a plus','Clear writing','Curious about AI']},
];
const foot=(i)=>`<div class="foot"><span>KARL AGENTIC · CAREERS</span><span><b>${String(i).padStart(2,'0')}</b> / 08</span></div>`;
const header=(l)=>`<div class="top"><span class="lab">${l}</span><img src="${LOGO}" alt=""></div>`;
let h=`<section class="s" id="s1">${header('Job Announcement')}
 <svg class="arrow" viewBox="0 0 100 100"><path d="M18 18 L82 82 M82 30 V82 H30" fill="none" stroke="#F0287A" stroke-width="13" stroke-linecap="square"/></svg>
 <div class="big">we’re<br>hiring</div><span class="chip">6 open roles</span>
 <p class="cov-sub">Karl Agentic is growing. We build AI agents, install servers and GPU machines, and create design and video for brands.</p>
 <div class="cov-list"><span>Servers</span><span>AI / LLM</span><span>Design</span><span>Electronics</span><span>3D &amp; Video</span><span>Social</span></div>${foot(1)}</section>`;
ROLES.forEach((r,i)=>{h+=`<section class="s">${header('Job Announcement')}<div class="num">ROLE 0${i+1} / 06</div>
 <div class="illo"><img src="../assets/hire/${r.k}.png" alt=""></div>
 <div class="role">${r.t}</div><div class="tags">${r.tags.map(t=>`<span>${t}</span>`).join('')}</div>
 <div class="cols"><div><h4>WHAT YOU’LL DO</h4><ul>${r.do.map(x=>`<li>${x}</li>`).join('')}</ul></div><div><h4>YOU’LL NEED</h4><ul>${r.need.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>${foot(i+2)}</section>`});
h+=`<section class="s proof">${header('Already building')}
 <h2>Join a studio that’s <em>already shipping.</em></h2>
 <div class="illo"><img src="../assets/hire/studio.png" alt=""></div>
 <div class="grid">
  <div><b>Royal Crest</b><span>WhatsApp booking concierge for a luxury brand</span></div>
  <div><b>45 content carousels</b><span>Our own design and automation studio</span></div>
  <div><b>GPU &amp; server setups</b><span>Workstations, Docker, private AI</span></div>
  <div><b>KarlCon family</b><span>Sister brands in hospitality and tech</span></div></div>
 <div class="apply"><div><b>How to apply</b><span>Email your CV and portfolio. Subject: Application – [role]</span></div><span class="mail">${MAIL}</span></div>
 ${foot(8)}</section>`;
document.getElementById('root').innerHTML=h;
Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>document.body.dataset.ready=1);
</script></body></html>
