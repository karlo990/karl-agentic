<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head><body>
<!-- Pink app-tile version of the combined Karl Agentic logo: white glowing seal + check, 3D white cursor. -->
<div id="c"></div>
<script>
function seal(cx,cy,r,a,n){let d='';for(let i=0;i<=240;i++){const t=i/240*Math.PI*2,rr=r+a*Math.cos(n*t);d+=(i?'L':'M')+(cx+rr*Math.cos(t)).toFixed(2)+' '+(cy+rr*Math.sin(t)).toFixed(2)}return d+'Z'}
const P='M0 0 L0 17.5 L4.6 13.4 L7.6 20.4 L10.8 19 L7.8 12.2 L13.6 12.2 Z';
const round=location.hash==='#round';
document.getElementById('c').innerHTML=`<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs><radialGradient id="bg" cx="35%" cy="25%" r="90%"><stop offset="0" stop-color="#FF6FAD"/><stop offset=".5" stop-color="#F0287A"/><stop offset="1" stop-color="#9E0C47"/></radialGradient>
<linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#DCE3EF"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="6" dy="14" stdDeviation="12" flood-color="#3D0420" flood-opacity=".5"/></filter></defs>
${round?'<circle cx="512" cy="512" r="512" fill="url(#bg)"/>':'<rect width="1024" height="1024" rx="230" fill="url(#bg)"/>'}
<g filter="url(#glow)"><path d="${seal(470,470,300,16,16)}" fill="none" stroke="#fff" stroke-width="30" stroke-linejoin="round"/>
<circle cx="470" cy="470" r="240" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".55" stroke-width="9"/>
<path d="M348 476 L438 562 L612 384" fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(640 640)" filter="url(#sh)">
 <g stroke="#fff" stroke-width="16" stroke-linecap="round"><line x1="-6" y1="-34" x2="-10" y2="-80"/><line x1="22" y1="-28" x2="50" y2="-66"/><line x1="38" y1="-6" x2="84" y2="-16"/></g>
 <path d="${P}" transform="translate(7 11) scale(15)" fill="#0B1530"/>
 <path d="${P}" transform="scale(15)" fill="url(#face)" stroke="#0B1530" stroke-width="1" stroke-linejoin="round"/></g>
</svg>`;document.body.dataset.ready=1;
</script></body></html>
