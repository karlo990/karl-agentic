<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}#c{width:1200px;height:800px;position:relative;overflow:hidden}svg{display:block}</style></head>
<body><div id="c"></div>
<script>
// Original product illustrations for the Hardware section (not manufacturer photos).
const PINK='#F0287A',PINK2='#FF5A9E';
let uid=0;const id=p=>p+(uid++);
function defs(){return `<defs>
<radialGradient id="bg" cx="50%" cy="78%" r="70%"><stop offset="0" stop-color="#2a0a18"/><stop offset=".45" stop-color="#0e0b10"/><stop offset="1" stop-color="#050507"/></radialGradient>
<radialGradient id="floor" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="${PINK}" stop-opacity=".55"/><stop offset="1" stop-color="${PINK}" stop-opacity="0"/></radialGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4d55"/><stop offset=".18" stop-color="#2a2c31"/><stop offset=".6" stop-color="#16171a"/><stop offset="1" stop-color="#0c0c0e"/></linearGradient>
<linearGradient id="metalH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a1b1f"/><stop offset=".5" stop-color="#3a3d44"/><stop offset="1" stop-color="#15161a"/></linearGradient>
<linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8eaee"/><stop offset=".5" stop-color="#9da2ab"/><stop offset="1" stop-color="#5d626b"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d27a"/><stop offset="1" stop-color="#a8782a"/></linearGradient>
<linearGradient id="pinkbar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${PINK}" stop-opacity="0"/><stop offset=".2" stop-color="${PINK2}"/><stop offset=".8" stop-color="${PINK}"/><stop offset="1" stop-color="${PINK}" stop-opacity="0"/></linearGradient>
<radialGradient id="hub" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#5a5e66"/><stop offset="1" stop-color="#121316"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="30" stdDeviation="26" flood-color="#000" flood-opacity=".75"/></filter>
<pattern id="mesh" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="3.2" fill="#050506"/></pattern>
<pattern id="vent" width="10" height="22" patternUnits="userSpaceOnUse"><rect x="2" y="3" width="5" height="16" rx="2.5" fill="#060607"/></pattern>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
</defs>`}
function stage(inner,floorY=640,fw=820){return `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">${defs()}
<rect width="1200" height="800" fill="url(#bg)"/><rect width="1200" height="800" fill="url(#grid)" opacity=".7"/>
<ellipse cx="600" cy="${floorY}" rx="${fw/2}" ry="70" fill="url(#floor)"/>
<line x1="${600-fw/2}" y1="${floorY+8}" x2="${600+fw/2}" y2="${floorY+8}" stroke="url(#pinkbar)" stroke-width="2"/>
${inner}</svg>`}
function fan(cx,cy,r,blades=9){let b='';for(let i=0;i<blades;i++){const a=i*360/blades;b+=`<path d="M0 ${-r*.22} C ${r*.35} ${-r*.35}, ${r*.62} ${-r*.62}, ${r*.25} ${-r*.92} C ${r*.05} ${-r*.7}, ${-r*.05} ${-r*.45}, 0 ${-r*.22}Z" transform="rotate(${a})" fill="#1c1d21" stroke="#2e3036" stroke-width="1.5"/>`}
 return `<g transform="translate(${cx} ${cy})"><circle r="${r+8}" fill="#060607" stroke="#33363d" stroke-width="3"/><circle r="${r}" fill="#0b0b0d"/>${b}<circle r="${r*.24}" fill="url(#hub)" stroke="#3b3e45" stroke-width="2"/><circle r="${r*.1}" fill="${PINK}" opacity=".9"/></g>`}

const ART={
 // triple-fan desktop graphics card, 3/4 front
 'gpu-geforce'(){const x=150,y=270,w=900,h=250;return stage(`<g filter="url(#shadow)">
  <rect x="${x-46}" y="${y-18}" width="40" height="${h+70}" rx="4" fill="url(#silver)"/>${[0,1,2,3,4,5].map(i=>`<rect x="${x-36}" y="${y+10+i*38}" width="20" height="24" rx="3" fill="#2a2d33"/>`).join('')}
  <rect x="${x+60}" y="${y+h-6}" width="380" height="40" fill="url(#gold)"/>${Array.from({length:38},(_,i)=>`<rect x="${x+64+i*10}" y="${y+h-2}" width="5" height="34" fill="#c99a40"/>`).join('')}
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="26" fill="url(#metal)" stroke="#3c3f46" stroke-width="2"/>
  <rect x="${x+12}" y="${y+12}" width="${w-24}" height="${h-24}" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".06"/>
  ${fan(x+160,y+h/2,96)}${fan(x+450,y+h/2,96)}${fan(x+740,y+h/2,96)}
  <rect x="${x+30}" y="${y+h-16}" width="${w-60}" height="5" rx="2.5" fill="url(#pinkbar)" filter="url(#glow)"/>
  <path d="M${x+20} ${y+8} L${x+w-20} ${y+8}" stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/></g>`,610,900)},
 // blower-style workstation card
 'gpu-workstation'(){const x=170,y=300,w=860,h=200;return stage(`<g filter="url(#shadow)">
  <rect x="${x-44}" y="${y-14}" width="38" height="${h+56}" rx="4" fill="url(#silver)"/>${[0,1,2,3,4].map(i=>`<rect x="${x-34}" y="${y+8+i*38}" width="18" height="26" rx="3" fill="#2a2d33"/>`).join('')}
  <rect x="${x+70}" y="${y+h-6}" width="360" height="36" fill="url(#gold)"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="#0f1013" stroke="#34373e" stroke-width="2"/>
  <rect x="${x}" y="${y}" width="${w}" height="60" rx="14" fill="url(#metalH)" opacity=".7"/>
  <rect x="${x+30}" y="${y+86}" width="520" height="80" rx="8" fill="url(#vent)"/>
  ${fan(x+w-150,y+h/2,78,11)}
  <path d="M${x+580} ${y+30} L${x+600} ${y+h-30}" stroke="${PINK}" stroke-width="6" filter="url(#glow)"/>
  <rect x="${x+20}" y="${y+h-14}" width="${w-40}" height="4" rx="2" fill="url(#pinkbar)" filter="url(#glow)"/></g>`,600,880)},
 // data-centre GPU module with heatsink (top view)
 'gpu-datacenter'(){const x=300,y=150,w=600,h=430;let fins='';for(let i=0;i<34;i++)fins+=`<rect x="${x+150+i*12}" y="${y+60}" width="6" height="${h-120}" fill="#3a3d44"/>`;
  return stage(`<g filter="url(#shadow)">
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="16" fill="#101a14" stroke="#24342a" stroke-width="3"/>
  ${Array.from({length:22},(_,i)=>`<rect x="${x+20}" y="${y+30+i*17}" width="90" height="8" fill="url(#gold)" opacity=".85"/>`).join('')}
  <rect x="${x+140}" y="${y+50}" width="${w-170}" height="${h-100}" rx="10" fill="url(#metalH)" stroke="#4a4e56" stroke-width="2"/>${fins}
  <rect x="${x+140}" y="${y+50}" width="${w-170}" height="40" rx="10" fill="#1a1b1f"/>
  <text x="${x+160}" y="${y+77}" font-family="Inter,Arial" font-weight="700" font-size="20" fill="#cfd2d8" letter-spacing="4">GPU · HBM</text>
  <circle cx="${x+w-50}" cy="${y+70}" r="7" fill="${PINK}" filter="url(#glow)"/>
  <rect x="${x+150}" y="${y+h-38}" width="${w-190}" height="4" fill="url(#pinkbar)" filter="url(#glow)"/></g>`,620,760)},
 // 2U rack server, front 3/4 with top face
 'server-2u'(){const x=150,y=300,w=900,h=170;let bays='';for(let i=0;i<12;i++){const bx=x+190+i*56;bays+=`<rect x="${bx}" y="${y+28}" width="48" height="${h-56}" rx="4" fill="#15161a" stroke="#34373e"/><rect x="${bx+8}" y="${y+40}" width="32" height="70" rx="2" fill="url(#vent)"/><circle cx="${bx+24}" cy="${y+h-44}" r="4" fill="${i%5==3?'#ffb020':PINK}" filter="url(#glow)"/>`}
  return stage(`<g filter="url(#shadow)">
  <path d="M${x} ${y} L${x+70} ${y-60} L${x+w+70} ${y-60} L${x+w} ${y}Z" fill="#2a2c31"/>
  <path d="M${x+w} ${y} L${x+w+70} ${y-60} L${x+w+70} ${y+h-60} L${x+w} ${y+h}Z" fill="#121316"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#metal)" stroke="#3c3f46" stroke-width="2"/>
  <rect x="${x-26}" y="${y}" width="26" height="${h}" fill="url(#silver)"/><rect x="${x+w}" y="${y}" width="26" height="${h}" fill="url(#silver)" opacity=".8"/>
  <rect x="${x+24}" y="${y+26}" width="140" height="${h-52}" rx="6" fill="url(#mesh)" stroke="#2e3036"/>
  ${bays}<circle cx="${x+70}" cy="${y+h/2}" r="10" fill="${PINK}" filter="url(#glow)"/>
  <rect x="${x}" y="${y+h-5}" width="${w}" height="3" fill="url(#pinkbar)" filter="url(#glow)"/></g>`,580,960)},
 // full rack (hero)
 'rack'(){const x=410,y=60,w=380,h=640;let units='';for(let i=0;i<11;i++){const uy=y+30+i*54;units+=`<rect x="${x+24}" y="${uy}" width="${w-48}" height="46" fill="url(#metal)" stroke="#3a3d44"/>${Array.from({length:8},(_,j)=>`<rect x="${x+110+j*30}" y="${uy+8}" width="24" height="30" rx="2" fill="#0d0d10" stroke="#2c2e34"/><circle cx="${x+122+j*30}" cy="${uy+32}" r="2.6" fill="${(i*3+j)%7==0?'#ffb020':PINK}" filter="url(#glow)"/>`).join('')}<rect x="${x+36}" y="${uy+10}" width="60" height="26" fill="url(#mesh)"/>`}
  return stage(`<g filter="url(#shadow)">
  <path d="M${x+w} ${y} L${x+w+110} ${y-40} L${x+w+110} ${y+h-40} L${x+w} ${y+h}Z" fill="#0c0c0e" stroke="#25272c"/>
  <path d="M${x} ${y} L${x+110} ${y-40} L${x+w+110} ${y-40} L${x+w} ${y}Z" fill="#1d1e22"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#08080a" stroke="#34373e" stroke-width="3"/>${units}
  <rect x="${x+4}" y="${y}" width="6" height="${h}" fill="${PINK}" filter="url(#glow)" opacity=".9"/><rect x="${x+w-10}" y="${y}" width="6" height="${h}" fill="${PINK}" filter="url(#glow)" opacity=".9"/></g>
  <ellipse cx="600" cy="740" rx="420" ry="40" fill="${PINK}" opacity=".25" filter="url(#soft)"/>`,730,980)},
 // tower workstation with glass side
 'workstation'(){const x=400,y=120,w=400,h=520;return stage(`<g filter="url(#shadow)">
  <path d="M${x+w} ${y} L${x+w+120} ${y-50} L${x+w+120} ${y+h-50} L${x+w} ${y+h}Z" fill="#0c0c10" stroke="#3a3d44" stroke-width="2"/>
  <path d="M${x+w+14} ${y+20} L${x+w+106} ${y-18} L${x+w+106} ${y+h-70} L${x+w+14} ${y+h-24}Z" fill="#1a0a12" opacity=".95"/>
  <path d="M${x+w+24} ${y+260} L${x+w+96} ${y+230} L${x+w+96} ${y+262} L${x+w+24} ${y+292}Z" fill="${PINK}" filter="url(#glow)"/>
  ${[0,1,2].map(i=>`<circle cx="${x+w+60}" cy="${y+60+i*0}" r="0"/>`).join('')}
  <path d="M${x} ${y} L${x+120} ${y-50} L${x+w+120} ${y-50} L${x+w} ${y}Z" fill="#26282d"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="url(#metal)" stroke="#3c3f46" stroke-width="2"/>
  <rect x="${x+40}" y="${y+40}" width="${w-80}" height="${h-110}" rx="6" fill="url(#mesh)" opacity=".95"/>
  <rect x="${x+40}" y="${y+h-50}" width="${w-80}" height="4" fill="url(#pinkbar)" filter="url(#glow)"/>
  <circle cx="${x+w/2}" cy="${y+h-26}" r="7" fill="${PINK}" filter="url(#glow)"/></g>`,650,700)},
 // compact AI desktop box
 'ai-mini'(){const x=420,y=330,w=360,h=150,d=90;return stage(`<g filter="url(#shadow)">
  <path d="M${x} ${y} L${x+d} ${y-d*.6} L${x+w+d} ${y-d*.6} L${x+w} ${y}Z" fill="url(#metalH)"/>
  ${Array.from({length:9},(_,i)=>`<path d="M${x+40+i*34} ${y-6} L${x+40+i*34+d*.8} ${y-d*.55}" stroke="#0a0a0c" stroke-width="10" stroke-linecap="round"/>`).join('')}
  <path d="M${x+w} ${y} L${x+w+d} ${y-d*.6} L${x+w+d} ${y+h-d*.6} L${x+w} ${y+h}Z" fill="#101114"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="url(#metal)" stroke="#45484f" stroke-width="2"/>
  <rect x="${x+20}" y="${y+h-30}" width="${w-40}" height="4" rx="2" fill="url(#pinkbar)" filter="url(#glow)"/>
  <circle cx="${x+w-36}" cy="${y+36}" r="6" fill="${PINK}" filter="url(#glow)"/>
  ${[0,1,2].map(i=>`<rect x="${x+30+i*40}" y="${y+40}" width="28" height="14" rx="3" fill="#060607" stroke="#3a3d44"/>`).join('')}</g>`,560,620)},
 // edge AI module / dev kit
 'edge'(){const x=380,y=250,w=440,h=320;return stage(`<g filter="url(#shadow)">
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="#0f1712" stroke="#26372c" stroke-width="3"/>
  ${Array.from({length:20},(_,i)=>`<rect x="${x+30+i*19}" y="${y+18}" width="10" height="10" fill="url(#gold)"/><rect x="${x+30+i*19}" y="${y+34}" width="10" height="10" fill="url(#gold)"/>`).join('')}
  <rect x="${x+90}" y="${y+70}" width="260" height="200" rx="10" fill="url(#metalH)" stroke="#4a4e56" stroke-width="2"/>
  ${Array.from({length:16},(_,i)=>`<rect x="${x+104+i*15}" y="${y+84}" width="7" height="172" fill="#2a2c31"/>`).join('')}
  ${fan(x+220,y+170,62,7)}
  ${[0,1,2,3].map(i=>`<rect x="${x+w-14}" y="${y+60+i*56}" width="40" height="36" rx="4" fill="url(#silver)"/>`).join('')}
  <circle cx="${x+40}" cy="${y+h-30}" r="7" fill="${PINK}" filter="url(#glow)"/>
  <rect x="${x+30}" y="${y+h-12}" width="${w-60}" height="3" fill="url(#pinkbar)" filter="url(#glow)"/></g>`,620,700)},
 // network switch + NAS
 'network'(){const x=200,y=250,w=800,h=90;let ports='';for(let r=0;r<2;r++)for(let i=0;i<24;i++)ports+=`<rect x="${x+150+i*26}" y="${y+14+r*36}" width="20" height="26" rx="2" fill="#070708" stroke="#3a3d44"/><rect x="${x+153+i*26}" y="${y+16+r*36}" width="6" height="3" fill="${(i+r)%4==0?'#ffb020':PINK}" filter="url(#glow)"/>`;
  const nx=430,ny=400;let bays='';for(let i=0;i<4;i++)bays+=`<rect x="${nx+30+i*80}" y="${ny+30}" width="64" height="160" rx="6" fill="#141518" stroke="#34373e"/><rect x="${nx+42+i*80}" y="${ny+46}" width="40" height="110" fill="url(#vent)"/><circle cx="${nx+62+i*80}" cy="${ny+174}" r="4" fill="${PINK}" filter="url(#glow)"/>`;
  return stage(`<g filter="url(#shadow)"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#metal)" stroke="#3c3f46" stroke-width="2"/>${ports}<rect x="${x+24}" y="${y+20}" width="100" height="50" fill="url(#mesh)"/>
  <rect x="${nx}" y="${ny}" width="360" height="220" rx="10" fill="url(#metal)" stroke="#3c3f46" stroke-width="2"/>${bays}</g>`,650,900)}
};
const key=location.hash.slice(1)||'gpu-geforce';
document.getElementById('c').innerHTML=ART[key]();document.body.dataset.ready='1';
</script></body></html>
